name: CI / Venue

on:
  pull_request:
    paths: ["packages/venue/**", "apps/web/public/venues/**", ".github/workflows/ci-venue.yml"]
  push:
    branches: [main]
    paths: ["packages/venue/**", "apps/web/public/venues/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/venue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/venue/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
